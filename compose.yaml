name: findbook

services:
  frontend:
    build: ./app/frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api

  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GeminiApi__ApiKey: ${GEMINI_API_KEY:-}
      GeminiApi__Model: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
